    <script>
        /* -------------------------------------------------------------
           1. SINGLE DIGITAL CLOCK LOGIC
           ------------------------------------------------------------- */
        function updateClock() {
            const now = new Date();

            let localHours = now.getHours();
            const localMins = String(now.getMinutes()).padStart(2, '0');
            const localSecs = String(now.getSeconds()).padStart(2, '0');
            const localAmpm = localHours >= 12 ? 'PM' : 'AM';
            
            localHours = localHours % 12;
            localHours = localHours ? localHours : 12;
            const formattedLocalHours = String(localHours).padStart(2, '0');

            document.getElementById('localClockTime').innerHTML = `
                ${formattedLocalHours}:${localMins}:${localSecs} <span class="text-2xl sm:text-4xl text-cyan-400 font-normal">${localAmpm}</span>
            `;

            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('localClockDate').textContent = now.toLocaleDateString(undefined, dateOptions);
        }

        try {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (tz) document.getElementById('localZoneLabel').textContent = tz;
        } catch(e){}

        setInterval(updateClock, 200);
        updateClock();


        /* -------------------------------------------------------------
           2. TIMER LABELS PERSISTENCE & PRESETS
           ------------------------------------------------------------- */
        function saveTimerLabel(id) {
            const labelValue = document.getElementById(`label${id}`).value;
            localStorage.setItem(`timerLabel_${id}`, labelValue);
        }

        function loadTimerLabels() {
            [1, 2, 3].forEach(id => {
                const saved = localStorage.getItem(`timerLabel_${id}`);
                if (saved !== null) {
                    document.getElementById(`label${id}`).value = saved;
                }
            });
        }

        function setPresetLabel(id, label) {
            const input = document.getElementById(`label${id}`);
            input.value = label;
            saveTimerLabel(id);
        }

        loadTimerLabels();


        /* -------------------------------------------------------------
           3. WEB AUDIO API SYNTHESIZER
           ------------------------------------------------------------- */
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const RINGER_PITCHES = {
            1: [523.25, 659.25, 783.99], // C5 Major Triad
            2: [587.33, 739.99, 880.00], // D5 Major Triad
            3: [659.25, 830.61, 987.77]  // E5 Major Triad
        };

        function playChimeTone(timerId, freq, duration, delay = 0) {
            if (!audioCtx) return;

            setTimeout(() => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (err) {
                    console.error("Audio playback error:", err);
                }
            }, delay * 1000);
        }

        function triggerRingerPattern(timerId) {
            const pitches = RINGER_PITCHES[timerId] || RINGER_PITCHES[1];
            playChimeTone(timerId, pitches[0], 0.4, 0);
            playChimeTone(timerId, pitches[1], 0.5, 0.15);
            playChimeTone(timerId, pitches[2], 0.7, 0.35);
        }


        /* -------------------------------------------------------------
           4. TRIPLE TIMERS LOGIC & STATE MANAGEMENT
           ------------------------------------------------------------- */
        const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 66; // ~414.69

        const timerState = {
            1: { total: 30, remaining: 30, ticker: null, isRunning: false, isRinging: false, alarmInterval: null },
            2: { total: 30, remaining: 30, ticker: null, isRunning: false, isRinging: false, alarmInterval: null },
            3: { total: 30, remaining: 30, ticker: null, isRunning: false, isRinging: false, alarmInterval: null }
        };

        function updateTimerDisplay(id) {
            const state = timerState[id];
            const mins = Math.floor(state.remaining / 60);
            const secs = state.remaining % 60;
            
            document.getElementById(`timerDisplay${id}`).textContent = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const progressRatio = state.total > 0 ? (state.remaining / state.total) : 0;
            const offset = CIRCLE_CIRCUMFERENCE * (1 - progressRatio);
            document.getElementById(`timerProgressCircle${id}`).style.strokeDashoffset = offset;
        }

        function applyCustomTime() {
            const mins = parseInt(document.getElementById('inputMins3').value) || 0;
            const secs = parseInt(document.getElementById('inputSecs3').value) || 0;
            const totalSecs = (mins * 60) + secs;

            if (totalSecs <= 0) return;

            resetTimer(3);
            timerState[3].total = totalSecs;
            timerState[3].remaining = totalSecs;
            updateTimerDisplay(3);
        }

        function startAlarmRinger(id) {
            initAudioContext();
            const state = timerState[id];
            state.isRinging = true;

            triggerRingerPattern(id);

            if (state.alarmInterval) clearInterval(state.alarmInterval);
            state.alarmInterval = setInterval(() => triggerRingerPattern(id), 1200);

            updateTimerUI(id);
        }

        function silenceRinger(id) {
            const state = timerState[id];
            if (state.alarmInterval) {
                clearInterval(state.alarmInterval);
                state.alarmInterval = null;
            }
            state.isRinging = false;
            updateTimerUI(id);
        }

        function toggleTimer(id) {
            initAudioContext();
            const state = timerState[id];

            if (state.isRunning) {
                // Pause Timer
                clearInterval(state.ticker);
                state.isRunning = false;
                updateTimerUI(id);
            } else {
                // Auto reset if starting from 0
                if (state.remaining === 0) {
                    resetTimer(id);
                }

                state.isRunning = true;
                updateTimerUI(id);

                state.ticker = setInterval(() => {
                    if (state.remaining > 0) {
                        state.remaining--;
                        updateTimerDisplay(id);

                        if (state.remaining === 0) {
                            clearInterval(state.ticker);
                            state.isRunning = false;
                            startAlarmRinger(id);
                        }
                    }
                }, 1000);
            }
        }

        function resetTimer(id) {
            const state = timerState[id];

            if (state.ticker) clearInterval(state.ticker);
            state.isRunning = false;

            silenceRinger(id);

            if (id === 3) {
                const mins = parseInt(document.getElementById('inputMins3').value) || 0;
                const secs = parseInt(document.getElementById('inputSecs3').value) || 0;
                state.total = (mins * 60) + secs || 30;
            } else {
                state.total = 30;
            }

            state.remaining = state.total;
            updateTimerDisplay(id);
            updateTimerUI(id);
        }

        function updateTimerUI(id) {
            const state = timerState[id];
            const startBtnText = document.getElementById(`startBtnText${id}`);
            const startBtnIcon = document.getElementById(`startBtnIcon${id}`);
            const startBtn = document.getElementById(`startTimerBtn${id}`);
            const stopBtn = document.getElementById(`stopRingerBtn${id}`);
            const timerCard = document.getElementById(`timerCard${id}`);
            const statusBadge = document.getElementById(`statusBadge${id}`);

            if (state.isRunning) {
                startBtnText.textContent = "Pause";
                startBtnIcon.className = "fa-solid fa-pause text-sm";
                startBtn.className = "py-2.5 px-4 rounded-xl font-semibold bg-amber-600 hover:bg-amber-500 text-white shadow-lg transition-all flex items-center justify-center gap-2";
            } else {
                startBtnText.textContent = state.remaining < state.total && state.remaining > 0 ? "Resume" : "Start";
                startBtnIcon.className = "fa-solid fa-play text-sm";
                startBtn.className = "py-2.5 px-4 rounded-xl font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition-all flex items-center justify-center gap-2";
            }

            if (state.isRinging) {
                stopBtn.disabled = false;
                stopBtn.className = "w-full py-2.5 px-4 rounded-xl font-bold bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-900/40 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 animate-bounce";

                timerCard.classList.add('alarm-active', 'border-rose-500', 'ring-4', 'ring-rose-500/30');

                statusBadge.textContent = "RINGING";
                statusBadge.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-rose-500 text-white uppercase tracking-wider animate-pulse";
            } else {
                stopBtn.disabled = true;
                stopBtn.className = "w-full py-2.5 px-4 rounded-xl font-bold bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed transition-all duration-200 flex items-center justify-center gap-2";

                timerCard.classList.remove('alarm-active', 'border-rose-500', 'ring-4', 'ring-rose-500/30');

                if (state.remaining === 0) {
                    statusBadge.textContent = "Finished";
                    statusBadge.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-emerald-500/20 text-emerald-400 uppercase tracking-wider";
                } else if (state.isRunning) {
                    statusBadge.textContent = "Running";
                    statusBadge.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-rose-500/20 text-rose-400 uppercase tracking-wider";
                } else if (state.remaining < state.total) {
                    statusBadge.textContent = "Paused";
                    statusBadge.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-amber-500/20 text-amber-400 uppercase tracking-wider";
                } else {
                    statusBadge.textContent = "Ready";
                    statusBadge.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-slate-700 text-slate-300 uppercase tracking-wider";
                }
            }
        }

        /* -------------------------------------------------------------
           5. DARK / LIGHT THEME TOGGLE
           ------------------------------------------------------------- */
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                document.body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white";
                themeIcon.className = "fa-solid fa-moon text-lg text-slate-600";
            } else {
                html.classList.add('dark');
                document.body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white";
                themeIcon.className = "fa-solid fa-sun text-lg text-slate-300";
            }
        });

        // Initialize displays on load
        updateTimerDisplay(1);
        updateTimerDisplay(2);
        updateTimerDisplay(3);
    </script>
</body>
</html>
