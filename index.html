<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timer & Clock Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#06b6d4',
                            600: '#0891b2',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Pulsing Alert Animation for Ringing Timers */
        @keyframes alert-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .alarm-active {
            animation: alert-pulse 0.8s infinite ease-in-out;
        }

        /* Glassmorphism panel style */
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="w-full max-w-7xl mx-auto px-4 py-5 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-stopwatch text-xl text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">Multi-Timer & Clock Suite</h1>
                <p class="text-xs text-slate-400">1 Digital Clock • 3 Labeled Timers</p>
            </div>
        </div>
        
        <!-- Theme Controls -->
        <div class="flex items-center gap-3">
            <button id="themeToggleBtn" title="Toggle Theme" class="p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-cyan-400 hover:border-cyan-500/50 transition-all duration-200 shadow-sm">
                <i id="themeIcon" class="fa-solid fa-sun text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-7xl mx-auto px-4 py-8 flex-grow flex flex-col justify-center space-y-8">
        
        <!-- SECTION 1: SINGLE DIGITAL CLOCK -->
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-clock text-cyan-400"></i>
                <h2 class="text-sm font-semibold tracking-wider uppercase text-slate-400">Live Local Clock</h2>
            </div>

            <div class="glass-panel bg-slate-800/60 border border-slate-700/60 rounded-3xl p-8 flex flex-col justify-between shadow-2xl relative overflow-hidden group hover:border-slate-600 transition-all max-w-3xl mx-auto">
                <div class="absolute top-0 right-0 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl group-hover:bg-cyan-500/20 transition-all"></div>
                
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-semibold tracking-wider text-cyan-400 uppercase flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span> Live Time
                    </span>
                    <i class="fa-solid fa-globe text-slate-500 text-lg"></i>
                </div>

                <div class="my-auto py-6 text-center">
                    <div id="localClockTime" class="mono-font text-5xl sm:text-7xl font-black tracking-tight text-slate-100">
                        00:00:00 <span class="text-2xl sm:text-4xl text-cyan-400 font-normal">AM</span>
                    </div>
                    <div id="localClockDate" class="text-slate-400 text-base sm:text-lg mt-4 font-medium">
                        Loading Local Date...
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-700/50 flex justify-between text-xs text-slate-400">
                    <span>Format: <strong class="text-slate-300">12-Hour AM/PM</strong></span>
                    <span>Zone: <strong id="localZoneLabel" class="text-emerald-400">Local</strong></span>
                </div>
            </div>
        </div>

        <!-- SECTION 2: TRIPLE TIMERS WITH CUSTOM LABELS -->
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-hourglass-half text-rose-400"></i>
                <h2 class="text-sm font-semibold tracking-wider uppercase text-slate-400">Task-Labeled Timers</h2>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- TIMER 1 CARD (Fixed 1-Min) -->
                <div id="timerCard1" class="glass-panel bg-slate-800/60 border border-slate-700/60 rounded-3xl p-6 flex flex-col justify-between shadow-xl relative overflow-hidden transition-all duration-300">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold tracking-wider text-rose-400 uppercase flex items-center gap-1.5">
                            <i class="fa-solid fa-stopwatch"></i> Timer 1 (1 Min)
                        </span>
                        <span id="statusBadge1" class="text-[10px] px-2.5 py-1 rounded-full font-bold bg-slate-700 text-slate-300 uppercase tracking-wider">Ready</span>
                    </div>

                    <!-- Editable Label Input -->
                    <div class="mb-2">
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-tag text-xs text-slate-400 absolute left-3 pointer-events-none"></i>
                            <input id="label1" type="text" value="Quick Sprint" oninput="saveTimerLabel(1)" placeholder="Enter Task Label..." 
                                   class="w-full pl-8 pr-3 py-1.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs font-semibold text-rose-300 placeholder-slate-500 focus:outline-none focus:border-rose-500 transition-all">
                        </div>
                        <!-- Quick presets -->
                        <div class="flex gap-1 mt-1.5">
                            <button onclick="setPresetLabel(1, 'Sprint')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition-all">Sprint</button>
                            <button onclick="setPresetLabel(1, 'Tea Break')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition-all">Tea Break</button>
                            <button onclick="setPresetLabel(1, 'Stretch')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition-all">Stretch</button>
                        </div>
                    </div>

                    <!-- Progress Ring -->
                    <div class="relative flex justify-center items-center py-2">
                        <svg class="w-40 h-40 transform -rotate-90">
                            <circle cx="80" cy="80" r="66" stroke="currentColor" stroke-width="8" class="text-slate
