<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-Labeled Timer Suite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .alarm-active {
            animation: pulse-ring 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="w-full max-w-7xl mx-auto px-4 py-6 flex justify-between items-center border-b border-slate-800/80">
        <div class="flex items-center gap-3">
            <div class="p-2.5 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400">
                <i class="fa-solid fa-clock-rotate-left text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Task Timer Suite</h1>
                <p class="text-xs text-slate-400">Multi-Timer Workflow Assistant</p>
            </div>
        </div>

        <button id="themeToggleBtn" class="p-3 rounded-2xl bg-slate-800/80 border border-slate-700/80 hover:bg-slate-700 text-slate-300 transition-all active:scale-95">
            <i id="themeIcon" class="fa-solid fa-sun text-lg text-slate-300"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-7xl mx-auto px-4 py-8 flex-grow space-y-8">

        <!-- Live Digital Clock Display -->
        <div class="glass-panel bg-slate-800/40 border border-slate-700/50 rounded-3xl p-6 sm:p-8 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-12 -left-12 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -right-12 w-40 h-40 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col items-center justify-center space-y-2">
                <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">
                    <i class="fa-solid fa-globe"></i>
                    <span id="localZoneLabel">Local Time Zone</span>
                </div>
                
                <div id="localClockTime" class="mono-font text-4xl sm:text-6xl font-extrabold tracking-tight text-white py-2">
                    00:00:00 <span class="text-2xl sm:text-4xl text-cyan-400 font-normal">AM</span>
                </div>

                <div id="localClockDate" class="text-sm sm:text-base font-medium text-slate-400">
                    Loading Date...
                </div>
            </div>
        </div>

        <!-- Timers Grid -->
        <div class="space-y-4">
            <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-stopwatch text-cyan-400"></i> Active Timers
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- TIMER 1 CARD (Fixed 30-Sec) -->
                <div id="timerCard1" class="glass-panel bg-slate-800/60 border border-slate-700/60 rounded-3xl p-6 flex flex-col justify-between shadow-xl relative overflow-hidden transition-all duration-300">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold tracking-wider text-rose-400 uppercase flex items-center gap-1.5">
                            <i class="fa-solid fa-stopwatch"></i> Timer 1 (30 Sec)
                        </span>
                        <span id="statusBadge1" class="text-[10px] px-2.5 py-1 rounded-full font-bold bg-slate-700 text-slate-300 uppercase tracking-wider">Ready</span>
                    </div>

                    <!-- Label Input & Top Quick Presets -->
                    <div class="mb-2">
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-tag text-xs text-slate-400 absolute left-3 pointer-events-none"></i>
                            <input id="label1" type="text" value="Sprint Task" oninput="saveTimerLabel(1)" placeholder="Enter Task Label..." 
                                   class="w-full pl-8 pr-3 py-1.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs font-semibold text-rose-300 placeholder-slate-500 focus:outline-none focus:border-rose-500 transition-all">
                        </div>
                        <!-- Top Presets -->
                        <div class="flex gap-1 mt-1.5 flex-wrap">
                            <button onclick="setPresetLabel(1, 'Sprint')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition-all">Sprint</button>
                            <button onclick="setPresetLabel(1, 'Stretch')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition-all">Stretch</button>
                            <button onclick="setPresetLabel(1, 'Quick Note')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition-all">Quick Note</button>
                        </div>
                    </div>

                    <!-- Progress Ring -->
                    <div class="relative flex justify-center items-center py-2">
                        <svg class="w-40 h-40 transform -rotate-90">
                            <circle cx="80" cy="80" r="66" stroke="currentColor" stroke-width="8" class="text-slate-700/50" fill="transparent"/>
                            <circle id="timerProgressCircle1" cx="80" cy="80" r="66" stroke="currentColor" stroke-width="8" 
                                    class="text-rose-500 transition-all duration-1000 ease-linear" 
                                    fill="transparent" 
                                    stroke-dasharray="414.69" 
                                    stroke-dashoffset="0"
                                    stroke-linecap="round"/>
                        </svg>

                        <div class="absolute flex flex-col items-center justify-center">
                            <span id="timerDisplay1" class="mono-font text-3xl font-extrabold text-slate-100">00:30</span>
                            <span id="timerSubtext1" class="text-[11px] text-slate-400 mt-1">Fixed 30s</span>
                        </div>
                    </div>

                    <!-- Bottom Quick Presets -->
                    <div class="flex justify-center gap-1 my-2 flex-wrap border-t border-slate-700/40 pt-2">
                        <button onclick="setPresetLabel(1, 'Rest')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-900/60 hover:bg-slate-700 text-slate-300 transition-all">Rest</button>
                        <button onclick="setPresetLabel(1, 'Plank')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-900/60 hover:bg-slate-700 text-slate-300 transition-all">Plank</button>
                        <button onclick="setPresetLabel(1, 'Breathe')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-900/60 hover:bg-slate-700 text-slate-300 transition-all">Breathe</button>
                    </div>

                    <!-- Timer Controls -->
                    <div class="space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button id="startTimerBtn1" onclick="toggleTimer(1)" class="py-2.5 px-4 rounded-xl font-semibold bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white shadow-lg transition-all flex items-center justify-center gap-2">
                                <i id="startBtnIcon1" class="fa-solid fa-play text-sm"></i>
                                <span id="startBtnText1">Start</span>
                            </button>

                            <button id="resetTimerBtn1" onclick="resetTimer(1)" class="py-2.5 px-4 rounded-xl font-semibold bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-rotate-left text-sm"></i>
                                <span>Reset</span>
                            </button>
                        </div>

                        <button id="stopRingerBtn1" onclick="silenceRinger(1)" disabled class="w-full py-2.5 px-4 rounded-xl font-bold bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed transition-all duration-200 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-volume-xmark text-base"></i>
                            <span>Stop Ringer</span>
                        </button>
                    </div>
                </div>

                <!-- TIMER 2 CARD (Fixed 30-Sec) -->
                <div id="timerCard2" class="glass-panel bg-slate-800/60 border border-slate-700/60 rounded-3xl p-6 flex flex-col justify-between shadow-xl relative overflow-hidden transition-all duration-300">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold tracking-wider text-amber-400 uppercase flex items-center gap-1.5">
                            <i class="fa-solid fa-stopwatch"></i> Timer 2 (30 Sec)
                        </span>
                        <span id="statusBadge2" class="text-[10px] px-2.5 py-1 rounded-full font-bold bg-slate-700 text-slate-300 uppercase tracking-wider">Ready</span>
                    </div>

                    <!-- Label Input & Top Quick Presets -->
                    <div class="mb-2">
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-tag text-xs text-slate-400 absolute left-3 pointer-events-none"></i>
                            <input id="label2" type="text" value="Quick Review" oninput="saveTimerLabel(2)" placeholder="Enter Task Label..." 
                                   class="w-full pl-8 pr-3 py-1.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs font-semibold text-amber-300 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-all">
                        </div>
                        <!-- Top Presets -->
                        <div class="flex gap-1 mt-1.5 flex-wrap">
                            <button onclick="setPresetLabel(2, 'Review')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-700 text-slate-300 transition-all">Review</button>
                            <button onclick="setPresetLabel(2, 'Hydrate')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-700/60 hover:bg-slate-7
